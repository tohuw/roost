name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and CLI
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps --editable .

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Smoke-test the console entry point
        run: roost --help

      - name: Import the Windows tray
        if: runner.os == 'Windows'
        run: python -c "from roost import windows_support, windows_tray"

      - name: Exercise native Windows runtime
        if: runner.os == 'Windows'
        run: python -m pytest tests/windows -q
