[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appistry"
dynamic = ["version"]
description = "Local app registry and macOS/Windows tray launcher"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Ron Scott-Adams" },
]
keywords = ["menubar", "system-tray", "macos", "windows", "launcher", "local-apps"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]

[project.urls]
Homepage      = "https://github.com/tohuw/appistry"
Repository    = "https://github.com/tohuw/appistry"
Issues        = "https://github.com/tohuw/appistry/issues"
Documentation = "https://github.com/tohuw/appistry/blob/main/SPEC.md"

[project.scripts]
appistry = "appistry:main"

[tool.setuptools]
py-modules = [
  "appistry",
  "cleanup",
  "hooks",
  "launch",
  "menubar",
  "process",
  "registry",
  "windows_support",
  "windows_tray",
]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
