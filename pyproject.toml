[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
# "roost", not "appistry", and this must stay true even though the repository has
# since been renamed to match. A separate internal tool called Appistry is still in
# daily use on the same machines, owning the `appistry` console script, ~/.appistry,
# and top-level `appistry`/`menubar`/`windows_*` modules. Installing this
# distribution must never displace that one — see the coexistence section of
# README.md. The constraint is the other tool's existence, not this repo's old name.
name = "roost"
dynamic = ["version"]
description = "One shared status menu bar for every bird on the machine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Ron Scott-Adams" },
]
keywords = ["menubar", "system-tray", "macos", "windows", "status", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
]

[project.urls]
Homepage      = "https://github.com/tohuw/roost"
Repository    = "https://github.com/tohuw/roost"
Issues        = "https://github.com/tohuw/roost/issues"
Documentation = "https://github.com/tohuw/roost/blob/main/SPEC.md"

[project.scripts]
roost = "roost.cli:main"

[tool.setuptools]
# One package, no top-level modules. Installing flat `menubar`, `windows_support`,
# and `windows_tray` modules — as this project used to, and as the internal
# Appistry still does — means whichever distribution is installed second silently
# overwrites the other's modules in a shared environment.
packages = ["roost"]

[tool.setuptools.package-data]
roost = ["assets/*", "help.md"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
